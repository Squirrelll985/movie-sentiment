[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-sentiment-system"
version = "1.0.0"
description = "LSTM-based movie review sentiment analysis system with an explainable Flask interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "Flask>=3.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentiment*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
